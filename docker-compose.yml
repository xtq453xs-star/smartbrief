services:
  # -----------------------------------
  # 1. データベース (MySQL: 業務/カタログデータ用)
  # -----------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql_server
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - '--default-authentication-plugin=mysql_native_password'
      - '--log_bin_trust_function_creators=1'
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
      - '--max_connections=500'
    networks:
      n8n_data_ai_net:
        ipv4_address: 10.10.0.100
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------
  # ★NEW: データベース (PostgreSQL: n8nシステム用)
  # -----------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres_server
    restart: always
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_data_ai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------
  # 2. n8n 本体
  # -----------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_server
    restart: always
    user: root
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_USER_MANAGEMENT_ID=1000
      - N8N_USER_MANAGEMENT_GID=1000
      - HOME=/home/node
      - N8N_CUSTOM_NODE_PATHS=/home/node/.n8n/nodes
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - GENERIC_TIMEZONE=Asia/Tokyo
      - TZ=Asia/Tokyo
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres_server
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - NODE_OPTIONS=--max-old-space-size=16384
    volumes:
      - ./n8n_data/.n8n:/home/node/.n8n
      - ./n8n_data/aozora_data/aozorabunko_text-master:/aozora
      - ./n8n_data/aozora_data:/n8n_files
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - n8n_data_ai_net

  # -----------------------------------
  # 3. Cloudflare Tunnel
  # -----------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - n8n_data_ai_net

  # -----------------------------------
  # 4. Billing API (Java)
  # -----------------------------------
  billing-api:
    build: 
      context: ./demo
      dockerfile: Dockerfile
    container_name: billing-api
    restart: always
    environment:
      - SPRING_R2DBC_URL=${BILLING_DB_URL}
      - SPRING_R2DBC_USERNAME=${BILLING_DB_USER}
      - SPRING_R2DBC_PASSWORD=${BILLING_DB_PASSWORD}
      - AOZORA_R2DBC_URL=${AOZORA_DB_URL}
      - AOZORA_R2DBC_USERNAME=${AOZORA_DB_USER}
      - AOZORA_R2DBC_PASSWORD=${AOZORA_DB_PASSWORD}
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL}
    depends_on:
      mysql:
        condition: service_healthy 
    networks:
      - n8n_data_ai_net

  # -----------------------------------
  # 5. フロントエンド (React/Nginx 本番構成)
  # -----------------------------------
  react-app:
    build:
      context: ./frontend 
      dockerfile: Dockerfile 
    container_name: react_frontend
    restart: always
    depends_on:
      - billing-api
    networks:
      - n8n_data_ai_net

  # -----------------------------------
  # ★NEW: Ollama (Local AI Engine with GPU)
  # -----------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    restart: always
    volumes:
      - ./ollama_data:/root/.ollama
    # NVIDIA GPUを使用するための設定
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - n8n_data_ai_net

  # -----------------------------------
  # 6. 検索マイクロサービス (Go)
  # -----------------------------------
  search-api:
    build:
      context: ./search-api
      dockerfile: Dockerfile
    container_name: search_api_go
    restart: always
    ports:
      - "8081:8081"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_HOST=qdrant
      - MYSQL_DSN=${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql_server:3306)/aozora_db?charset=utf8mb4
      - VECTOR_DIMENSION=1024
      - OLLAMA_HOST=ollama # ★修正: host.docker.internalからコンテナ名に変更
    depends_on:
      - qdrant
      - ollama
    networks:
      - n8n_data_ai_net

  # -----------------------------------
  # 7. ベクトルDB (Qdrant)
  # -----------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_server
    restart: always
    ports:
      - "6333:6333" 
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - n8n_data_ai_net

# ==========================================
# networks & volumes
# ==========================================
networks:
  n8n_data_ai_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/16

volumes:
  mysql_data:
    external: true
  postgres_data: 
  qdrant_data: